name: Build Cudy TR3000 256MB (ImmortalWrt 25.12)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tr3000-256mb-25.12.yml
      - config/256m.config
      - scripts/prepare-25.12.sh
  workflow_dispatch:
    inputs:
      commit:
        description: "Optional ImmortalWrt commit SHA (defaults to latest openwrt-25.12)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      DEBIAN_FRONTEND: noninteractive
      SOURCE_REPO: https://github.com/immortalwrt/immortalwrt.git
      SOURCE_BRANCH: openwrt-25.12
      CCACHE_DIR: /tmp/ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - name: Check out workflow and existing profile
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev \
            gperf help2man intltool libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev \
            libssl-dev libtool libyaml-dev libz-dev lld llvm make mkisofs ninja-build \
            patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion \
            swig texinfo unzip wget xmlto xxd zlib1g-dev zstd

      - name: Fetch ImmortalWrt source
        run: |
          git clone --depth 1 --single-branch --branch "$SOURCE_BRANCH" "$SOURCE_REPO" openwrt
          if [ -n "${{ inputs.commit }}" ]; then
            git -C openwrt fetch --depth 1 origin "${{ inputs.commit }}"
            git -C openwrt checkout --detach FETCH_HEAD
          fi
          git -C openwrt log -1 --format='%H %s' | tee source-revision.txt

      - name: Add iStore feed
        working-directory: openwrt
        run: |
          if ! grep -q '^src-git istore ' feeds.conf.default; then
            echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
          fi

      - name: Update feeds and install packages
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -d y -p istore luci-app-store

      - name: Import packages retained from the existing 256M profile
        env:
          OPENWRT_DIR: ${{ github.workspace }}/openwrt
        run: bash scripts/prepare-25.12.sh

      - name: Cache compiler and downloaded sources
        uses: actions/cache@v4
        with:
          path: |
            /tmp/ccache
            openwrt/dl
          key: ${{ runner.os }}-immortalwrt-25.12-tr3000-${{ hashFiles('config/256m.config') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-25.12-tr3000-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --set-config=cache_dir=$CCACHE_DIR
          ccache --set-config=compression=true

      - name: Migrate the existing 256M configuration
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/config/256m.config" .config
          sed -i 's/cudy_tr3000-v1-256mb/cudy_tr3000-256mb-v1/g' .config

          # Remove packages that exist only in the old MTK-specific source fork.
          sed -i -E '/^CONFIG_PACKAGE_(luci-app-eqos-mtk|luci-app-mtwifi-cfg|luci-app-turboacc-mtk|datconf|datconf-lua|mii_mgr|mtk-smp|mtkhqos_util|mtwifi-cfg|regs|switch|kmod-conninfra|kmod-mt_wifi|kmod-warp|wifi-dats)=y$/d' .config

          make defconfig
          grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cudy_tr3000-256mb-v1=y$' .config

          for package in luci-app-store luci-theme-argon luci-app-argon-config \
                         luci-theme-aurora luci-app-aurora-config luci-app-bandix \
                         bandix luci-app-qmodem \
                         luci-app-qmodem-sms qmodem tom_modem; do
            if ! grep -qx "CONFIG_PACKAGE_${package}=y" .config; then
              echo "::error::Expected package was not resolved by make defconfig: ${package}"
              exit 1
            fi
          done

          echo "Migrated device and package selections:"
          grep -E '^(CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cudy_tr3000-256mb-v1=|CONFIG_PACKAGE_(luci-app-store|luci-theme-argon|luci-app-argon-config|luci-theme-aurora|luci-app-aurora-config|luci-app-bandix|bandix|luci-app-qmodem|luci-app-qmodem-sms|qmodem|tom_modem)=)' .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j"$(nproc)"

      - name: Compile firmware
        working-directory: openwrt
        run: |
          if ! make -j"$(nproc)" CC="ccache gcc" CXX="ccache g++"; then
            echo "Parallel build failed; retrying with one job for diagnostics."
            make -j1 V=s
          fi

      - name: Collect firmware and build metadata
        if: success()
        run: |
          mkdir -p firmware
          cp -a openwrt/bin/targets/mediatek/filogic/. firmware/
          cp source-revision.txt firmware/
          cp openwrt/.config firmware/build.config
          sed -n 's/^KERNEL_PATCHVER:=/Linux /p' openwrt/target/linux/mediatek/Makefile > firmware/kernel-version.txt
          find firmware -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-cudy-tr3000-256mb
          path: firmware/
          if-no-files-found: error
          retention-days: 14
